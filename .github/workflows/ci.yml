# Named `ci`, not `tests`, because there deliberately are none — see CLAUDE.md.
# What runs here is the whole automated safety net: formatters, linters, both type
# checkers, and the four project guards.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # `composer setup` runs `php artisan migrate --force`, and this project is on
    # MySQL. Credentials match .env.example, which setup copies to .env verbatim.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: personal_assistant
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # Bun, not Node: composer setup calls `bun install` and `bun run build`, and the
      # gates are bun scripts. ubuntu-latest ships neither bun nor a bun-aware npx.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
